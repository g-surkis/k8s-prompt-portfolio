
#                                                                               
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-app-job
  labels:
    app: demo-app
spec:
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: busybox
          command:
            - sh
            - -c
            - echo Running one-off task; sleep 5; echo Done
      restartPolicy: Never
  backoffLimit: 4
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
